name: Build FreeBass

on:
  push:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Configure (universal: Apple Silicon + Intel)"
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build VST3 + AU
        run: cmake --build build --config Release --target FreeBass_VST3 FreeBass_AU -- -quiet

      - name: Ad-hoc sign
        run: |
          codesign --force --deep -s - "build/FreeBass_artefacts/Release/VST3/FreeBass.vst3"
          codesign --force --deep -s - "build/FreeBass_artefacts/Release/AU/FreeBass.component"

      - name: Check architectures
        run: lipo -info "build/FreeBass_artefacts/Release/VST3/FreeBass.vst3/Contents/MacOS/FreeBass"

      - name: Package
        run: |
          mkdir -p dist
          cp -R "build/FreeBass_artefacts/Release/VST3/FreeBass.vst3" dist/
          cp -R "build/FreeBass_artefacts/Release/AU/FreeBass.component" dist/
          cd dist && zip -qry ../FreeBass-macOS.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: FreeBass-macOS
          path: FreeBass-macOS.zip
